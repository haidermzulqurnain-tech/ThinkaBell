packages:
  - "apps/*"
  - "packages/*"

# Security remediation overrides. pnpm 11 no longer reads the pnpm
# field of package.json, so these overrides must live here to stay
# effective on pnpm 11 (pnpm 10.5+ also reads them from this file).
overrides:
  # tinypool floor. Affected range <= 2.1.0 (prototype-pollution gadget in
  # worker options -> RCE). ^2.1.1 closed CVE-2026-104848 / GHSA-5gmw-xhrv-c9v3;
  # ^2.1.2 also closes the compounding follow-up CVE-2026-104849 /
  # GHSA-85c8-ppgw-ccpr (run() options gadget, options now read from own
  # properties with a null-prototype ThreadPool.options). 2.2.0 is the latest
  # unaffected release if we later choose to track the newest 2.x line.
  tinypool: "^2.1.2"
  dompurify: "^3.4.16"
  postcss: "^8.5.29"
  "rollup@3.29.5": "^3.30.0"
  uuid: "^11.1.1"
  fast-uri: "^3.1.8"
  "source-map-js": "^1.2.2"
  "brace-expansion@1.1.18": "^1.1.21"
  "brace-expansion@2.1.4": "^2.1.7"
  "brace-expansion@5.0.9": "^5.0.12"

# Approve dependency lifecycle scripts. `allowBuilds` (added in pnpm 10.26,
# required by pnpm 11, which removed onlyBuiltDependencies) is the single
# source of truth; the pinned pnpm 10.34.6 reads it too, so the legacy
# package.json `pnpm` field and .npmrc `only-built-dependencies` were removed
# to avoid the pnpm-11 "ignored field" warning and config drift.
allowBuilds:
  "@sentry/cli": true
  core-js: true
  esbuild: true
  protobufjs: true
  sharp: true
  unrs-resolver: true
  workerd: true

# What to do when the running pnpm differs from the `packageManager` pin in
# package.json (pnpm@10.34.6).
#
# `download` (the default) downloads and re-execs the declared version. On the
# Hostinger build host that download is unavailable, so `download` aborts the
# build outright — which is the failure this setting is here to prevent. Corepack
# also blocks pnpm's own version switch, so the switch cannot succeed there.
#
# `warn` logs the mismatch and continues with the pnpm that is actually present
# (11.24.0 on the host). Both the automatic install and the Turbo build then run
# under the same pnpm, which keeps node_modules in one layout instead of the
# mixed 10/11 layout that was breaking the workspace.
#
# Added in pnpm 11, so only a pnpm 11+ host reads this; the pinned 10.34.6 used
# by CI and local dev matches the pin and never reaches this path.
pmOnFail: warn

# What `pnpm run` / `pnpm exec` do when node_modules is out of date.
#
# The default is `install`, which means any mismatched pnpm that decides the
# tree is stale will try to remove and rebuild node_modules. That is not a
# hypothetical: running a pnpm that differs from the one that installed
# destroyed node_modules here (ERR_PNPM_PACKAGE_MANAGER_REMOVE_MODULES_DIR),
# and on a host with an empty store or no network the same attempt fails the
# build outright.
#
# `warn` makes the run read-only with respect to node_modules: it reports the
# staleness and proceeds. Installs are then only performed deliberately, by
# `pnpm install`, which is what CI, the Hostinger pipeline, and the
# dependency-refresh commits already do.
verifyDepsBeforeRun: warn
