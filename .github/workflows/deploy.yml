name: Deploy to Hostinger

on:
  push:
    branches: ["main"]
  workflow_dispatch:

# Minimal read-only token permissions: contents (checkout + repo metadata for
# the diagnostic step). The deploy steps use HOSTINGER_* secrets, not the
# GITHUB_TOKEN, so this does not widen the deploy's access.
permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Diagnose deploy secrets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Repository: ${{ github.repository }}"
          META=$(curl -sS -H "Authorization: Bearer ${GITHUB_TOKEN}" \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/${{ github.repository }}")
          echo "Repo metadata (confirms which repo this workflow runs on):"
          echo "$META" | jq -r '"full_name: \(.full_name)   default_branch: \(.default_branch)   fork: \(.fork)   private: \(.private)"' 2>/dev/null \
            || echo "(could not read repo metadata)"
          if echo "$META" | jq -e '.fork == true' >/dev/null 2>&1; then
            PARENT=$(echo "$META" | jq -r '.parent.full_name // "(unknown)"')
            echo "::warning::This repository is a FORK of ${PARENT}. GitHub does NOT share secrets from the upstream repository to a fork — add the five HOSTINGER_* secrets to THIS fork (${{ github.repository }}) under Settings -> Secrets and variables -> Actions -> Repository secrets, and enable GitHub Actions in the fork's Actions tab. Then re-run."
          fi
          echo "List this repository's secret names locally (values are never shown):"
          echo "  gh secret list --repo ${{ github.repository }}"

      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: "pnpm"

      - name: Install dependencies
        run: pnpm install

      - name: Build web app (standalone)
        run: pnpm build:standalone

      - name: Package Hostinger bundle
        run: node scripts/prepare-hostinger.js

      - name: Verify Hostinger bundle
        run: pnpm tsx scripts/verify-hostinger-deploy.ts

      - name: Upload Hostinger bundle (artifact)
        uses: actions/upload-artifact@v4
        with:
          name: hostinger-deploy
          path: dist/hostinger-deploy
          retention-days: 7
          if-no-files-found: error

      - name: Verify Hostinger deploy secrets
        env:
          HOSTINGER_HOST: ${{ secrets.HOSTINGER_HOST }}
          HOSTINGER_USERNAME: ${{ secrets.HOSTINGER_USERNAME }}
          HOSTINGER_PASSWORD: ${{ secrets.HOSTINGER_PASSWORD }}
          HOSTINGER_PORT: ${{ secrets.HOSTINGER_PORT }}
          HOSTINGER_DEPLOY_PATH: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
        run: |
          set -e
          fail=0
          for name in HOSTINGER_HOST HOSTINGER_USERNAME HOSTINGER_PASSWORD HOSTINGER_PORT HOSTINGER_DEPLOY_PATH; do
            if [ -z "${!name}" ]; then
              echo "::error::$name is empty or not set"
              fail=1
            fi
          done
          if [ "$fail" -ne 0 ]; then
            echo "::error::Hostinger secrets are not reaching this workflow (secrets.HOSTINGER_* is null), so the automatic SCP deploy was skipped. The built bundle is attached to this run as the 'hostinger-deploy' artifact — download it and upload it to Hostinger via File Manager (see HOSTINGER_DEPLOYMENT.md, Step 3 Option B). To enable automatic deploy: (1) Re-run AFTER saving — secrets are read when the run is queued. (2) Add them as Repository secrets (Settings -> Secrets and variables -> Actions -> Repository secrets), not Environment or Organization secrets. (3) Confirm with: gh secret list --repo ${{ github.repository }}. Then re-run: Actions -> Deploy to Hostinger -> Run workflow."
            exit 1
          fi

      - name: Deploy via SCP
        uses: appleboy/scp-action@v1.0.0
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          source: "dist/hostinger-deploy/**"
          target: ${{ secrets.HOSTINGER_DEPLOY_PATH }}
          strip_components: 2

      - name: Restart Hostinger app
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.HOSTINGER_HOST }}
          username: ${{ secrets.HOSTINGER_USERNAME }}
          password: ${{ secrets.HOSTINGER_PASSWORD }}
          port: ${{ secrets.HOSTINGER_PORT }}
          script: |
            cd ${{ secrets.HOSTINGER_DEPLOY_PATH }}
            touch hostinger-server.js
